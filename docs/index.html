<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록물관리 채용공고</title>
<meta name="description" content="기록물관리전문요원·기록연구사 채용공고를 마감일 순으로 모아 보여줍니다.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085;
    --line: #e4e7ec; --accent: #2f5bd3; --accent-soft: #e8eefc;
    --urgent: #c4320a; --urgent-soft: #fdeee8; --soon: #b54708; --soon-soft: #fef6e7;
    --new: #067647; --new-soft: #e6f6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f26; --text: #e6e9ee; --muted: #98a2b3;
      --line: #2b323c; --accent: #7aa2ff; --accent-soft: #1f2a44;
      --urgent: #ff8a65; --urgent-soft: #3a211b; --soon: #fdb022; --soon-soft: #352a15;
      --new: #47cd89; --new-soft: #153326;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5; word-break: keep-all;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 12px; font-size: .85rem; }
  .chip b { font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .controls input, .controls select {
    font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text);
  }
  .controls input { flex: 1 1 220px; min-width: 0; }
  .list { display: grid; gap: 10px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;
         text-decoration: none; color: inherit; }
  .job:hover { border-color: var(--accent); }
  .dday { flex: 0 0 64px; text-align: center; border-radius: 10px; padding: 8px 0;
          font-weight: 700; font-variant-numeric: tabular-nums;
          background: var(--accent-soft); color: var(--accent); }
  .dday small { display: block; font-weight: 400; font-size: .72rem; }
  .job.urgent .dday { background: var(--urgent-soft); color: var(--urgent); }
  .job.soon .dday { background: var(--soon-soft); color: var(--soon); }
  .body { flex: 1; min-width: 0; }
  .org { font-size: .85rem; color: var(--muted); }
  .title { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
  .meta span { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .meta .new { color: var(--new); background: var(--new-soft); border-color: transparent; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>기록물관리 채용공고</h1>
  <p class="sub" id="updated">불러오는 중...</p>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <input id="q" type="search" placeholder="기관명·제목 검색 (예: 기록연구사, 서울)" aria-label="검색">
    <select id="type" aria-label="고용형태"><option value="">고용형태 전체</option></select>
    <select id="region" aria-label="지역"><option value="">지역 전체</option></select>
  </div>

  <div class="list" id="list"></div>

  <footer>
    매일 자동으로 업데이트됩니다. 출처: 공공데이터포털 <span id="sources">채용정보</span>.<br>
    지원 전에는 반드시 공고 원문에서 기간과 자격요건을 다시 확인해 주세요.
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let jobs = [];

function todayKST() {
  const now = new Date(Date.now() + 9 * 3600 * 1000);
  return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
}
function daysLeft(end) {
  if (!end) return null;
  const [y, m, d] = end.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - todayKST()) / 86400000);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fillSelect(el, values) {
  [...new Set(values.flatMap(v => String(v || "").split(",")).map(v => v.trim()).filter(Boolean))]
    .sort().forEach(v => el.add(new Option(v, v)));
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const type = $("type").value, region = $("region").value;
  const today = todayKST().toISOString().slice(0, 10);
  const weekAgo = new Date(todayKST() - 6 * 86400000).toISOString().slice(0, 10);

  const shown = jobs
    .map(j => ({ ...j, left: daysLeft(j.end) }))
    .filter(j => j.left === null || j.left >= 0)
    .filter(j => !q || (j.org + " " + j.title + " " + j.region).toLowerCase().includes(q))
    .filter(j => !type || (j.hire_type || "").includes(type))
    .filter(j => !region || (j.region || "").includes(region))
    .sort((a, b) => (a.left ?? 9999) - (b.left ?? 9999));

  const urgent = shown.filter(j => j.left !== null && j.left <= 3).length;
  const fresh = shown.filter(j => j.first_seen >= weekAgo).length;
  $("summary").innerHTML =
    `<span class="chip">진행 중 <b>${shown.length}</b>건</span>` +
    `<span class="chip">마감 임박(3일 이내) <b>${urgent}</b>건</span>` +
    `<span class="chip">최근 7일 새 공고 <b>${fresh}</b>건</span>`;

  if (!shown.length) {
    $("list").innerHTML = `<p class="empty">${jobs.length ? "조건에 맞는 공고가 없습니다." : "현재 진행 중인 기록물관리 공고가 없습니다.<br>매일 자동으로 다시 확인합니다."}</p>`;
    return;
  }
  $("list").innerHTML = shown.map(j => {
    const cls = j.left !== null && j.left <= 3 ? "urgent" : j.left !== null && j.left <= 7 ? "soon" : "";
    const label = j.left === null ? "상시" : j.left === 0 ? "D-day" : "D-" + j.left;
    const endTxt = j.end ? j.end.slice(5).replace("-", "/") + " 마감" : "마감일 확인";
    const isNew = j.first_seen >= weekAgo;
    return `<a class="job ${cls}" href="${esc(j.url)}" target="_blank" rel="noopener">
      <div class="dday">${label}<small>${endTxt}</small></div>
      <div class="body">
        <div class="org">${esc(j.org)}</div>
        <div class="title">${esc(j.title)}</div>
        <div class="meta">
          ${isNew ? '<span class="new">NEW</span>' : ""}
          ${j.status && j.status !== "모집중" ? `<span>${esc(j.status)}</span>` : ""}
          ${j.hire_type ? `<span>${esc(j.hire_type)}</span>` : ""}
          ${j.region ? `<span>${esc(j.region)}</span>` : ""}
          ${j.note ? `<span>${esc(j.note)}</span>` : ""}
          ${j.start ? `<span>접수 ${esc(j.start)} ~ ${esc(j.end || "")}</span>` : ""}
          <span>${esc(j.source)}</span>
        </div>
      </div>
    </a>`;
  }).join("");
}

fetch("data/jobs.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    jobs = data.jobs || [];
    $("updated").textContent = "마지막 업데이트: " + (data.updated_at || "-") + " (한국시간)";
    if (data.sources && data.sources.length) $("sources").textContent = data.sources.join(", ");
    fillSelect($("type"), jobs.map(j => j.hire_type));
    fillSelect($("region"), jobs.map(j => j.region));
    render();
  })
  .catch(() => { $("updated").textContent = "공고 목록을 불러오지 못했습니다. 잠시 후 다시 열어 주세요."; });

["q", "type", "region"].forEach(id => $(id).addEventListener("input", render));
</script>
</body>
</html>
